<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semana 04 - Arrays, DOM e Eventos</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 30px auto;
            padding: 0 20px;
            line-height: 1.6;
        }

        button, input {
            padding: 8px;
            margin: 5px 0;
        }

        .destaque {
            color: #b45309;
            font-weight: bold;
            background-color: #fef3c7;
        }

        .feito {
            text-decoration: line-through;
            color: #16803d;
        }

        li {
            cursor: pointer;
            padding: 4px;
        }

        section {
            margin-bottom: 30px;
        }
    </style>
</head>
<body>
    <header>
        <h1 id="titulo">Blog de Desenvolvimento Web</h1>
        <p class="texto">Praticando Arrays, DOM e Eventos.</p>
        <p class="texto">Aprendendo JavaScript na prática.</p>
    </header>

    <main>
        <section>
            <h2>Eventos</h2>
            <button id="botao" type="button">Clique aqui</button>

            <div>
                <label for="nome">Seu nome:</label>
                <input type="text" id="nome" placeholder="Digite seu nome">
            </div>
        </section>

        <section>
            <h2>Lista de tarefas</h2>

            <ul id="lista">
                <li>Item inicial 1</li>
                <li>Item inicial 2</li>
                <li>Item inicial 3</li>
            </ul>

            <form id="formulario">
                <label for="tarefa">Nova tarefa:</label>
                <input type="text" id="tarefa" placeholder="Digite uma tarefa">
                <button type="submit">Adicionar tarefa</button>
            </form>

            <p>Clique em um item para marcar ou desmarcar como feito.</p>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
